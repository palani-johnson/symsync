[package]
name = "symsync"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6.0", features = ["derive"] }
glob = "0.3.3"
json5 = "1.3.1"
pathdiff = "0.2"
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.34"
sha1 = "0.10"
symlink = "0.1.0"
toml = "1.1.2"

[dev-dependencies]
rstest = "0.26.1"
tempfile = "3"

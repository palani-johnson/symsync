[package]
name = "symsync"
version = "0.1.2"
edition = "2024"
rust-version = "1.89"
description = "A stateful symlink farm manager for dotfiles"
license = "MIT"
repository = "https://github.com/palani-johnson/symsync"
readme = "README.md"
keywords = ["dotfiles", "symlink", "stow", "cli"]
categories = ["command-line-utilities", "filesystem"]
include = ["src/**", "tests/**", "docs/**", "README.md", "LICENSE"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.6.0", features = ["derive"] }
json5 = "1.3.7"
pathdiff = "0.2.3"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.1"
toml = "1.2.1"
wax = "0.7.0"

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"
